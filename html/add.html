<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>/* apply saved theme immediately */(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}})();</script>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/add.css">
    <script src="../js/add.js"></script>
</head>
<body>
    <header>
        <h1 class="title">Add a New Recipe</h1>
        <nav>
            <button class="nav-btn" id="backBtn"> Back to Cookbook</button>
        </nav>
    </header>

    <main> 
        <form id="recipeForm" class="form-container">
            <label for="recipeName">Recipe Name *</label>
            <input type="text" id="recipeName" required placeholder="e.g Pasta Alfredo">

            <label for="ingredients">Ingredients (at least 2) *</label>
            <textarea id="ingredients" placeholder="Lst each ingredient on a new line" required></textarea>

            <label for="instruction">instructions (numbered steps) *</label>
            <textarea id="instruction" placeholder="1 Boil water/n2. Add pasta/n3. Stir sauce..." required></textarea>

            <label for="cookTime">Estimated Cook Time</label>
            <input type="text" id="cookTime" placeholder="e.g. 30 minutes">

            <label for="servings">Serving Size</label>
            <input type="text" id="servings" placeholder="e.g. 4 servings">

            <label for="hashtags">Hashtags *</label>
            <input type="text" id="hashtags" placeholder="#spicy #italian #grilled" required>

            <label for="recipeImage">Recipe Image</label>
            <input type="file" id="recipeImage" accept="image/*">
            <div class="image-preview-container">
                <img id="imagePreview" class="image-preview" alt="Image preview" style="display:none;" />
            </div>

            <button type="submit" class="save-btn">Save Recipe</button>
        </form>

        <section class="recent-section">
            <h2>Recently Added</h2>
            <div id="recentList" class="recent-list">
                <p>last 5 added recipes will appear here</p>
            </div>
        </section>
    </main>
    
</body>
</html>
