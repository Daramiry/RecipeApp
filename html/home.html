<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>/* apply saved theme immediately */(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}})();</script>
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/home.css">
    <script src="../js/home.js"></script>
</head>
<body>
    <div class="container">
        <div class="top-row">
            <h1 class ="title">Home Kitchen Recipes</h1>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
        </div>

        <p class="tagline">Warm Meals, Warm Memories</p>

        <div class="icon">🍲</div>
        
        <p class="discription">
            A cozy place to save the recipes we love.
        </p>

        <button class="enter-btn" id="enterBtn">
            Enter Cookbook
        </button>
        <button class="fav-btn" id="favBtn">View Favorites</button>
    </div>
    
</body>
</html>
