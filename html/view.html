<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Recipe</title>
  <script>/* apply saved theme immediately */(function(){try{if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}})();</script>
  <link rel="stylesheet" href="../css/theme.css">
  <link rel="stylesheet" href="../css/view.css">
  <script src="../js/view.js" defer></script>
</head>
<body>
  <header>
    <h1 id="recipeTitle">Recipe Title</h1>
    <nav>
      <button id="backBtn">Back to Cookbook</button>
      <button id="editBtn">Edit Recipe</button>
    </nav>
  </header>

  <main>
    <section id="recipeDetails">
      <h2>Ingredients</h2>
      <ul id="ingredientsList"></ul>

      <h2>Instructions</h2>
      <ol id="instructionsList"></ol>

      <h2>Hashtags</h2>
      <p id="hashtagsList"></p>
    </section>
  </main>
</body>
</html>
